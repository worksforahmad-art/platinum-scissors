<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D1D5DB" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#374151" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle decorative background elements -->
  <!-- Thin diagonal lines -->
  <line x1="80" y1="120" x2="180" y2="80" stroke="#D1D5DB" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="90" y1="140" x2="190" y2="100" stroke="#D1D5DB" stroke-width="0.5" stroke-opacity="0.35"/>
  <line x1="1020" y1="650" x2="1120" y2="700" stroke="#D1D5DB" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="1030" y1="630" x2="1130" y2="680" stroke="#D1D5DB" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- Decorative dots -->
  <circle cx="150" cy="200" r="2" fill="#9CA3AF" fill-opacity="0.3"/>
  <circle cx="165" cy="210" r="1.5" fill="#9CA3AF" fill-opacity="0.25"/>
  <circle cx="140" cy="220" r="1" fill="#9CA3AF" fill-opacity="0.2"/>
  <circle cx="1060" cy="580" r="2" fill="#9CA3AF" fill-opacity="0.3"/>
  <circle cx="1075" cy="570" r="1.5" fill="#9CA3AF" fill-opacity="0.25"/>
  <circle cx="1050" cy="560" r="1" fill="#9CA3AF" fill-opacity="0.2"/>

  <!-- Small geometric diamond shapes -->
  <rect x="100" y="600" width="8" height="8" transform="rotate(45 104 604)" fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="1080" y="160" width="8" height="8" transform="rotate(45 1084 164)" fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="1095" y="180" width="5" height="5" transform="rotate(45 1097.5 182.5)" fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Thin decorative circles -->
  <circle cx="200" cy="650" r="25" fill="none" stroke="#E5E7EB" stroke-width="0.5" stroke-opacity="0.5"/>
  <circle cx="1000" cy="150" r="18" fill="none" stroke="#E5E7EB" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Main scissors group -->
  <g filter="url(#shadow)" transform="translate(600, 400) rotate(-25)">
    <!-- Upper blade -->
    <g filter="url(#softGlow)">
      <path d="M -20,-8 L -280,-130 Q -310,-142 -320,-128 L -300,-115 L -20,2 Z"
            fill="url(#bladeGrad)" stroke="#374151" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Blade edge highlight -->
      <line x1="-20" y1="-3" x2="-300" y2="-122" stroke="#9CA3AF" stroke-width="0.4" stroke-opacity="0.5"/>
      <!-- Blade bevel line -->
      <line x1="-40" y1="-5" x2="-290" y2="-120" stroke="#6B7280" stroke-width="0.3" stroke-opacity="0.3" stroke-dasharray="4,6"/>
    </g>

    <!-- Lower blade -->
    <g filter="url(#softGlow)">
      <path d="M -20,8 L -260,165 Q -280,185 -290,170 L -275,155 L -20,-2 Z"
            fill="url(#bladeGrad)" stroke="#374151" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Blade edge highlight -->
      <line x1="-20" y1="3" x2="-270" y2="160" stroke="#9CA3AF" stroke-width="0.4" stroke-opacity="0.5"/>
      <!-- Blade bevel line -->
      <line x1="-35" y1="5" x2="-260" y2="155" stroke="#6B7280" stroke-width="0.3" stroke-opacity="0.3" stroke-dasharray="4,6"/>
    </g>

    <!-- Pivot screw -->
    <circle cx="0" cy="0" r="10" fill="#F3F4F6" stroke="#374151" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#6B7280" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#6B7280"/>

    <!-- Upper handle -->
    <g>
      <path d="M 20,-5 Q 60,-15 100,-35 Q 160,-65 190,-50 Q 220,-35 210,-5
               Q 200,20 160,25 Q 120,28 80,15 Q 40,5 20,5 Z"
            fill="none" stroke="#374151" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Handle inner ring -->
      <ellipse cx="155" cy="-15" rx="35" ry="28" fill="none" stroke="#6B7280" stroke-width="0.8" stroke-opacity="0.5"/>
    </g>

    <!-- Lower handle -->
    <g>
      <path d="M 20,5 Q 55,20 90,50 Q 140,90 160,100 Q 200,118 220,95
               Q 235,72 210,45 Q 185,25 140,10 Q 80,-5 20,-5 Z"
            fill="none" stroke="#374151" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Handle inner ring -->
      <ellipse cx="165" cy="68" rx="35" ry="30" fill="none" stroke="#6B7280" stroke-width="0.8" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- Additional decorative thin lines near scissors -->
  <line x1="350" y1="180" x2="380" y2="180" stroke="#9CA3AF" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="350" y1="186" x2="370" y2="186" stroke="#9CA3AF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="820" y1="600" x2="850" y2="600" stroke="#9CA3AF" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="830" y1="606" x2="850" y2="606" stroke="#9CA3AF" stroke-width="0.6" stroke-opacity="0.3"/>
</svg>
