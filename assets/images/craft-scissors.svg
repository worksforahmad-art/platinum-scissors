<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="craftBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E5E7EB" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="craftShadow">
      <feDropShadow dx="1" dy="2.5" stdDeviation="4" flood-color="#374151" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Cut paper shape - small star -->
  <g transform="translate(230, 260)" opacity="0.35">
    <polygon points="0,-18 5,-6 18,-6 8,3 12,16 0,9 -12,16 -8,3 -18,-6 -5,-6"
             fill="none" stroke="#9CA3AF" stroke-width="0.8" stroke-linejoin="round"/>
  </g>

  <!-- Another small cut paper piece -->
  <g transform="translate(560, 580)" opacity="0.3">
    <rect x="-12" y="-15" width="24" height="30" rx="1" fill="none" stroke="#D1D5DB" stroke-width="0.7"
          transform="rotate(12)"/>
    <!-- Cut line on paper -->
    <line x1="-8" y1="0" x2="8" y2="-2" stroke="#D1D5DB" stroke-width="0.5" stroke-dasharray="2,2"
          transform="rotate(12)"/>
  </g>

  <!-- Tiny confetti dots -->
  <circle cx="250" cy="520" r="2" fill="#D1D5DB" fill-opacity="0.3"/>
  <circle cx="540" cy="260" r="1.5" fill="#D1D5DB" fill-opacity="0.25"/>
  <circle cx="290" cy="300" r="1" fill="#D1D5DB" fill-opacity="0.2"/>

  <!-- Main craft scissors - slightly open, fine pointed -->
  <g filter="url(#craftShadow)" transform="translate(400, 400) rotate(-15)">
    <!-- Upper blade - fine pointed, slightly open upward -->
    <path d="M -12,-5 L -240,-65 Q -260,-72 -268,-62 L -255,-58 L -12,0 Z"
          fill="url(#craftBlade)" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Fine tip detail -->
    <line x1="-240" y1="-62" x2="-262" y2="-67" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Blade highlight -->
    <line x1="-18" y1="-2.5" x2="-248" y2="-61" stroke="#9CA3AF" stroke-width="0.3" stroke-opacity="0.4"/>

    <!-- Lower blade - fine pointed, slightly open downward -->
    <path d="M -12,5 L -235,80 Q -252,88 -260,78 L -248,73 L -12,0 Z"
          fill="url(#craftBlade)" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Fine tip detail -->
    <line x1="-235" y1="77" x2="-255" y2="83" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Blade highlight -->
    <line x1="-18" y1="2.5" x2="-242" y2="76" stroke="#9CA3AF" stroke-width="0.3" stroke-opacity="0.4"/>

    <!-- Pivot -->
    <circle cx="0" cy="0" r="7" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#6B7280" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="1" fill="#6B7280"/>

    <!-- Upper handle - compact craft style -->
    <path d="M 12,-3 Q 40,-15 70,-22 Q 105,-28 125,-18
             Q 145,-6 140,10 Q 132,24 105,25
             Q 75,24 50,15 Q 25,5 12,3 Z"
          fill="none" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="95" cy="0" rx="25" ry="18" fill="none" stroke="#6B7280" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Lower handle - compact craft style -->
    <path d="M 12,3 Q 40,15 70,22 Q 105,28 125,18
             Q 145,6 140,-10 Q 132,-24 105,-25
             Q 75,-24 50,-15 Q 25,-5 12,-3 Z"
          fill="none" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="95" cy="0" rx="25" ry="18" fill="none" stroke="#6B7280" stroke-width="0.6" stroke-opacity="0.5"/>
  </g>

  <!-- Subtle cut line from scissors -->
  <path d="M 185,310 Q 195,320 190,335" fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-opacity="0.35"
        stroke-dasharray="3,3" stroke-linecap="round"/>
</svg>
