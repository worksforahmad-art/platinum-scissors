<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simple scissors icon for favicon -->
  <!-- Upper blade -->
  <path d="M 14,15 L 3,10 Q 1.5,9.5 2,11 L 3.5,11.5 L 14,16 Z"
        fill="none" stroke="#374151" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Lower blade -->
  <path d="M 14,17 L 3,22 Q 1.5,22.5 2,21 L 3.5,20.5 L 14,16 Z"
        fill="none" stroke="#374151" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Pivot -->
  <circle cx="15" cy="16" r="1.5" fill="#F3F4F6" stroke="#374151" stroke-width="1"/>
  <!-- Upper handle ring -->
  <ellipse cx="23" cy="12" rx="5" ry="4" fill="none" stroke="#374151" stroke-width="1.2"/>
  <!-- Lower handle ring -->
  <ellipse cx="23" cy="20" rx="5" ry="4" fill="none" stroke="#374151" stroke-width="1.2"/>
  <!-- Connect handles to pivot -->
  <line x1="16" y1="15" x2="18.5" y2="13" stroke="#374151" stroke-width="1.2"/>
  <line x1="16" y1="17" x2="18.5" y2="19" stroke="#374151" stroke-width="1.2"/>
</svg>
