<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bladeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E5E7EB" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="1.5" dy="3" stdDeviation="5" flood-color="#374151" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Subtle background circle -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="400" cy="400" r="260" fill="#F9FAFB" fill-opacity="0.3" stroke="none"/>

  <!-- Small decorative dots on circle perimeter -->
  <circle cx="400" cy="120" r="2.5" fill="#D1D5DB" fill-opacity="0.5"/>
  <circle cx="400" cy="680" r="2.5" fill="#D1D5DB" fill-opacity="0.5"/>

  <!-- Scissors group - closed, slight angle -->
  <g filter="url(#dropShadow)" transform="translate(400, 400) rotate(-20)">
    <!-- Upper blade (on top) -->
    <path d="M -15,-6 L -300,-35 Q -320,-38 -325,-28 L -310,-24 L -15,2 Z"
          fill="url(#bladeFill)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade edge line -->
    <line x1="-20" y1="-2" x2="-310" y2="-29" stroke="#9CA3AF" stroke-width="0.4" stroke-opacity="0.4"/>

    <!-- Lower blade -->
    <path d="M -15,6 L -300,35 Q -320,38 -325,28 L -310,24 L -15,-2 Z"
          fill="url(#bladeFill)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade edge line -->
    <line x1="-20" y1="2" x2="-310" y2="29" stroke="#9CA3AF" stroke-width="0.4" stroke-opacity="0.4"/>

    <!-- Pivot -->
    <circle cx="0" cy="0" r="8" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#6B7280" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="1.2" fill="#6B7280"/>

    <!-- Upper handle -->
    <path d="M 15,-4 Q 50,-18 85,-30 Q 130,-45 160,-35 Q 185,-22 180,0
             Q 175,20 145,25 Q 110,28 75,15 Q 40,3 15,4 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle opening -->
    <ellipse cx="132" cy="-8" rx="30" ry="22" fill="none" stroke="#6B7280" stroke-width="0.7" stroke-opacity="0.5"/>

    <!-- Lower handle -->
    <path d="M 15,4 Q 50,18 85,30 Q 130,45 160,35 Q 185,22 180,0
             Q 175,-20 145,-25 Q 110,-28 75,-15 Q 40,-3 15,-4 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle opening -->
    <ellipse cx="132" cy="8" rx="30" ry="22" fill="none" stroke="#6B7280" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>
</svg>
