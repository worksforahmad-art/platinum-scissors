<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="shearBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D1D5DB" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shearShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#374151" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Subtle thread element - a curved thread with a loose end -->
  <path d="M 160,620 Q 200,600 230,630 Q 260,660 300,640 Q 340,620 360,650"
        fill="none" stroke="#D1D5DB" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M 360,650 Q 370,660 365,670"
        fill="none" stroke="#D1D5DB" stroke-width="0.8" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Thread spool hint -->
  <ellipse cx="145" cy="625" rx="12" ry="8" fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Second subtle thread -->
  <path d="M 580,180 Q 600,195 620,185 Q 640,175 655,190"
        fill="none" stroke="#E5E7EB" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Main tailoring shears - angled with long blades -->
  <g filter="url(#shearShadow)" transform="translate(400, 380) rotate(-30)">
    <!-- Upper blade - long and dramatic -->
    <path d="M -15,-7 L -360,-60 Q -385,-65 -390,-52 L -375,-48 L -15,1 Z"
          fill="url(#shearBlade)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade edge detail -->
    <line x1="-20" y1="-3" x2="-375" y2="-54" stroke="#9CA3AF" stroke-width="0.35" stroke-opacity="0.45"/>
    <!-- Serration hints near pivot -->
    <line x1="-30" y1="-4" x2="-30" y2="0" stroke="#9CA3AF" stroke-width="0.3" stroke-opacity="0.25"/>
    <line x1="-45" y1="-5" x2="-45" y2="0" stroke="#9CA3AF" stroke-width="0.3" stroke-opacity="0.25"/>
    <line x1="-60" y1="-6" x2="-60" y2="-1" stroke="#9CA3AF" stroke-width="0.3" stroke-opacity="0.25"/>

    <!-- Lower blade - long and dramatic -->
    <path d="M -15,7 L -350,80 Q -375,88 -380,75 L -365,70 L -15,-1 Z"
          fill="url(#shearBlade)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade edge detail -->
    <line x1="-20" y1="3" x2="-360" y2="74" stroke="#9CA3AF" stroke-width="0.35" stroke-opacity="0.45"/>

    <!-- Pivot screw -->
    <circle cx="0" cy="0" r="9" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="3.5" fill="none" stroke="#6B7280" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="1.3" fill="#6B7280"/>

    <!-- Upper handle - angled/bent for dressmaker style -->
    <path d="M 15,-5 Q 40,-20 70,-50 Q 100,-80 135,-85
             Q 170,-88 185,-65 Q 195,-42 175,-25
             Q 155,-10 120,0 Q 80,8 40,5 Q 20,2 15,5 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle ring -->
    <ellipse cx="140" cy="-50" rx="28" ry="24" fill="none" stroke="#6B7280" stroke-width="0.7" stroke-opacity="0.5"
             transform="rotate(-15 140 -50)"/>

    <!-- Lower handle - larger, angled for dressmaker -->
    <path d="M 15,5 Q 35,25 55,55 Q 80,95 115,115
             Q 150,130 180,115 Q 205,95 195,65
             Q 185,40 150,25 Q 110,10 70,0 Q 35,-5 15,-5 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle ring -->
    <ellipse cx="145" cy="75" rx="30" ry="28" fill="none" stroke="#6B7280" stroke-width="0.7" stroke-opacity="0.5"
             transform="rotate(20 145 75)"/>
  </g>

  <!-- Subtle fabric corner element bottom right -->
  <path d="M 620,680 L 660,680 L 660,720" fill="none" stroke="#E5E7EB" stroke-width="0.8" stroke-opacity="0.4" stroke-linejoin="round"/>
  <path d="M 625,685 L 655,685 L 655,715" fill="none" stroke="#E5E7EB" stroke-width="0.5" stroke-opacity="0.3" stroke-linejoin="round"/>
</svg>
