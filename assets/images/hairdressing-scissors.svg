<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="hairBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D1D5DB" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="hairShadow">
      <feDropShadow dx="1.5" dy="3" stdDeviation="5" flood-color="#374151" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Subtle hair strand decorative elements -->
  <g opacity="0.3">
    <path d="M 580,200 Q 590,230 585,260 Q 580,290 590,320"
          fill="none" stroke="#D1D5DB" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M 590,200 Q 598,235 594,265 Q 588,295 596,325"
          fill="none" stroke="#D1D5DB" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 600,205 Q 605,240 602,270 Q 597,298 603,330"
          fill="none" stroke="#D1D5DB" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- Subtle comb element -->
  <g transform="translate(195, 580) rotate(-10)" opacity="0.25">
    <rect x="0" y="0" width="80" height="12" rx="2" fill="none" stroke="#9CA3AF" stroke-width="0.7"/>
    <!-- Comb teeth -->
    <line x1="8" y1="12" x2="8" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="14" y1="12" x2="14" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="20" y1="12" x2="20" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="26" y1="12" x2="26" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="32" y1="12" x2="32" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="38" y1="12" x2="38" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="44" y1="12" x2="44" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="50" y1="12" x2="50" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="56" y1="12" x2="56" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="62" y1="12" x2="62" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="68" y1="12" x2="68" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
    <line x1="74" y1="12" x2="74" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
  </g>

  <!-- Main hairdressing scissors -->
  <g filter="url(#hairShadow)" transform="translate(400, 390) rotate(-22)">
    <!-- Upper blade - sleek professional -->
    <path d="M -14,-6 L -270,-55 Q -295,-62 -300,-50 L -285,-46 L -14,1 Z"
          fill="url(#hairBlade)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade convex curve highlight -->
    <path d="M -20,-2.5 Q -150,-35 -282,-49" fill="none" stroke="#9CA3AF" stroke-width="0.35" stroke-opacity="0.4"/>

    <!-- Lower blade - sleek professional -->
    <path d="M -14,6 L -265,70 Q -288,78 -295,66 L -280,62 L -14,-1 Z"
          fill="url(#hairBlade)" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Blade curve highlight -->
    <path d="M -20,2.5 Q -145,40 -275,64" fill="none" stroke="#9CA3AF" stroke-width="0.35" stroke-opacity="0.4"/>

    <!-- Pivot -->
    <circle cx="0" cy="0" r="8" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#6B7280" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="1.2" fill="#6B7280"/>

    <!-- Upper handle - ergonomic with offset -->
    <path d="M 14,-4 Q 45,-18 80,-28 Q 120,-38 148,-28
             Q 172,-16 168,5 Q 162,24 135,28
             Q 105,30 72,18 Q 38,5 14,4 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle ring -->
    <ellipse cx="118" cy="-4" rx="28" ry="22" fill="none" stroke="#6B7280" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Lower handle - with finger rest/tang -->
    <path d="M 14,4 Q 45,18 80,32 Q 118,48 145,40
             Q 172,30 170,8 Q 166,-12 138,-18
             Q 108,-20 74,-10 Q 38,-2 14,-4 Z"
          fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Handle ring -->
    <ellipse cx="118" cy="14" rx="28" ry="22" fill="none" stroke="#6B7280" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Finger rest / tang - distinctive hairdressing feature -->
    <path d="M 100,40 Q 108,55 98,65 Q 85,72 78,62 Q 72,52 82,44 Q 90,38 100,40 Z"
          fill="none" stroke="#374151" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Tang connecting arm -->
    <line x1="95" y1="38" x2="100" y2="40" stroke="#374151" stroke-width="1.4"/>
  </g>
</svg>
